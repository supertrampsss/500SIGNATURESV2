  <style>
    .privacy{background:var(--iv-2);color:#0b1422;padding:clamp(48px,7vw,96px) var(--marge) 80px;min-height:calc(100svh - var(--hdr))}

    .privacy footer{margin-top:28px;padding-top:18px;border-top:1px solid #0b14221f;font:400 12px var(--mono);color:#4a5568}

    .privacy .pied__sources li{display:grid;gap:2px;border-top:1px solid #0b142222;padding-top:10px}
    .privacy .pied__sources a{font:700 15px var(--sans);color:#0b1422}.privacy .pied__sources span{font:400 13px var(--sans);color:#4a5568}

  <a class="evitement" href="#contenu">Aller au contenu</a>

    </nav>

  <main class="privacy" id="contenu">
    <p class="privacy__kicker">Sources</p>
