<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Mandats, vérification responsive</title><style>body{margin:0;background:#26333b;color:white;font:16px system-ui;padding:20px}iframe{width:390px;height:844px;border:1px solid #aaa;display:block}p{max-width:640px}nav{display:flex;gap:16px;margin:18px 0}a{color:#eed2ae;padding:10px}h1{font-size:22px}</style></head><body><h1>Vérification responsive du jeu</h1><p>Cadre CSS, sans émulation du matériel, du toucher ni de Safari. Les liens changent le cadre et rechargent la partie sauvegardée.</p><nav aria-label="Largeur du cadre"><a href="?width=320">320 px</a><a href="?width=390">390 px</a><a href="?width=768">768 px</a></nav><iframe title="Mandats mobile" src="/mandats/"></iframe><script>if(new URL(location.href).searchParams.get('experience')==='winter') document.querySelector('iframe').src='/mandats/france/hiver/';const width = Number(new URL(location.href).searchParams.get('width')); if ([320,390,768].includes(width)) document.querySelector('iframe').style.width = width+'px';</script></body></html>
