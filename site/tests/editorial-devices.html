<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Vérification responsive des onglets</title><style>body{margin:20px;background:#283c43;color:white;font:16px system-ui}iframe{display:block;width:390px;height:844px;border:1px solid #aaa}nav{display:flex;gap:20px;margin:16px 0}a{color:white}</style><h1>Vérification responsive des onglets</h1><p>Cadre CSS uniquement. Les tests CI complètent cette vérification.</p><nav><a href="?page=salaires&width=390">Salaires</a><a href="?page=bilan&width=390">France</a><a href="?page=territoire&width=390">Territoires</a></nav><iframe title="Onglet mobile" src="/salaires"></iframe><script>const q=new URL(location.href).searchParams;const page=q.get('page'),w=Number(q.get('width'));if(['salaires','bilan','territoire'].includes(page))document.querySelector('iframe').src='/'+page;if([320,390,768].includes(w))document.querySelector('iframe').style.width=w+'px';</script></html>
