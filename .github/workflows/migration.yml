name: Appliquer une migration

# Aucun workflow n'appliquait de migration à la base de production : elles
# étaient rejouées de zéro en CI sur un PostGIS jetable, et posées à la main
# ailleurs. Une table déclarée dans `infra/` mais absente en production est un
# schéma qui ment.
#
# **Un fichier nommé, jamais le dossier.** Rejouer tout le répertoire échouerait
# dès la deuxième fois — les migrations existantes ne sont pas idempotentes. On
# désigne donc explicitement le fichier à appliquer, et lui seul.
#
# Le fichier désigné doit être rejouable (`if not exists`, `do $$ ... end $$`)
# et **additif** : cette porte n'existe pas pour supprimer ou réécrire des
# données. Une migration destructrice se discute avant, pas ici.

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "nom du fichier dans infra/supabase/migrations"
        required: true
  # Déclencheur GitOps : l'app GitHub de l'agent n'a pas `workflow_dispatch`.
  push:
    paths:
      - ".github/migration-request.json"

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client PostgreSQL
        run: |
          sudo sh -c "echo 'deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Appliquer
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          SAISI: ${{ inputs.fichier }}
        run: |
          set -e
          FICHIER="$SAISI"
          if [ -z "$FICHIER" ] && [ -f .github/migration-request.json ]; then
            FICHIER=$(jq -r '.fichier // empty' .github/migration-request.json)
          fi
          [ -n "$FICHIER" ] || { echo "aucun fichier désigné" >&2; exit 1; }
          # Pas de chemin : le fichier est pris dans le répertoire des
          # migrations et nulle part ailleurs.
          case "$FICHIER" in */*|..*) echo "nom de fichier invalide" >&2; exit 1;; esac
          CHEMIN="infra/supabase/migrations/$FICHIER"
          [ -f "$CHEMIN" ] || { echo "$CHEMIN introuvable" >&2; exit 1; }
          if grep -inE '\b(drop|truncate)\b' "$CHEMIN" | grep -viE 'drop (policy )?if exists'; then
            echo "migration destructrice : refusée par cette porte" >&2
            exit 1
          fi
          echo "application de $CHEMIN"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$CHEMIN"
          echo "appliquée ; rejouée une seconde fois pour vérifier l'idempotence"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$CHEMIN"
