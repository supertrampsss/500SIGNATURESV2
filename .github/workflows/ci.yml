name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest -e .
      - run: ruff check .
      - run: pytest -q

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Game and editorial mobile and desktop browser tests
        run: npm run test:mandats
      - name: Browser validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-browser-validation
          path: |
            site/playwright-report-mandats/
            site/test-results/
          retention-days: 7

  database:
    # Les tests d'intégration tournaient contre un PostGIS lancé en service :
    # ils exigeaient donc une base, un jeu de migrations rejoué, un seed chargé,
    # et n'étaient exécutés que dans ce job. L'entrepôt est un fichier DuckDB
    # créé à la volée : ils tournent partout, avec le reste, en quelques
    # secondes. Ce job n'a plus de raison d'être séparé — il l'est encore le
    # temps que la migration se stabilise, puis fusionnera avec `tests`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests d'intégration de l'entrepôt
        run: |
          pip install -q -e ./pipeline pytest
          pytest -q pipeline/tests

  visual-audit:
    # Audit visuel indépendant des tests unitaires : même si un test historique
    # échoue, les captures desktop/mobile restent produites et téléchargeables.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Typecheck et build du site
        run: npm run build
      - name: Installer Chromium pour l'audit visuel
        run: npx playwright install --with-deps chromium
      - name: Capturer Accueil, France et Villes
        run: npm run audit:visual
      - name: Publier les captures et le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-${{ github.sha }}
          path: site/visual-audit-artifacts/
          retention-days: 14

