name: Ingestion

# Exécute un run d'ingestion réel : registre (Supabase) -> connecteur ->
# snapshot immuable (R2 plateforme-raw) -> lineage (Supabase).
# Déclenchement manuel pour l'instant ; les crons par source arrivent avec
# les tickets d'ingestion (docs/08). Secrets requis : docs/SETUP.md §3.

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: "dataset_id du registre (meta.dataset_registry)"
        required: true
      params:
        description: 'Filtres JSON optionnels, ex. {"GEO":"COM-33318","maxResult":"20"}'
        required: false
        default: ""
  # Déclencheur GitOps : committer .github/ingest-request.json lance le run
  # décrit dedans (l'app GitHub de l'agent n'a pas le droit workflow_dispatch).
  push:
    paths:
      - ".github/ingest-request.json"

# Deux ingestions simultanées écrivent dans les mêmes tables et publient deux
# jeux de fichiers concurrents : le dernier arrivé fixe `data/derniere.json`,
# qui peut alors pointer vers un export plus ancien que la base. On attend.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # l'alerte de fraîcheur tient une issue à jour (T-23)

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Un run qui traîne bloque la file d'ingestion entière : mieux vaut qu'il
    # échoue et se voie.
    # 45 minutes suffisent à une ingestion ordinaire ; le job « rechargement »,
    # qui reconstruit tout l'entrepôt depuis les sources, en demande beaucoup
    # plus — et mieux vaut qu'il aille au bout qu'il soit coupé en chemin.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ./pipeline
      - name: Read request file (push trigger)
        id: req
        run: |
          if [ -f .github/ingest-request.json ]; then
            echo "dataset_id=$(jq -r '.dataset_id // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
            echo "params=$(jq -c '.params // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
            echo "job=$(jq -r '.job // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tiling toolchain
        # Après la lecture de la requête : c'est elle qui dit si on fait des tuiles.
        if: steps.req.outputs.job == 'geometries'
        run: sudo apt-get install -y -qq tippecanoe
      # L'entrepôt vit dans le bucket : le runner est éphémère, il le rapatrie
      # avant d'écrire et le renvoie après. Sans cet aller-retour, chaque
      # exécution repartirait d'un entrepôt vide et republierait un catalogue
      # amputé. C'est aussi la sauvegarde : le bucket versionne le fichier.
      - name: Rapatrier l'entrepôt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
        run: python -m plateforme.entrepot telecharger
      - name: Sync source registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
        run: python -m plateforme.registry
      - name: Run ingestion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
          DATASET_ID: ${{ inputs.dataset_id || steps.req.outputs.dataset_id }}
          PARAMS: ${{ inputs.params || steps.req.outputs.params }}
          JOB: ${{ steps.req.outputs.job }}
        run: |
          # Le référentiel géographique enchaîne collecte et normalisation :
          # un référentiel sans son historique territorial serait inutilisable.
          if [ "$JOB" = "geo" ]; then
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            exit $?
          fi
          # Le rechargement complet, en trois étapes reprenables. L'entrepôt est
          # un fichier renvoyé au bucket **même quand le run échoue** : refaire
          # une demi-heure d'OFGL parce que l'étape suivante a buté serait du
          # gaspillage pur. Chaque étape reprend là où la précédente s'est
          # arrêtée ; « rechargement » les enchaîne pour une reconstruction
          # depuis zéro.
          if [ "$JOB" = "inventaire" ]; then
            # Ne touche à rien : dit ce que l'entrepôt contient. Sert à savoir
            # où reprendre un chargement coupé, plutôt qu'à le deviner.
            python -m plateforme.inventaire
            exit $?
          fi
          if [ "$JOB" = "retrait-interco" ]; then
            # Le niveau intercommunal a quitté le produit. Le code ne l'écrit
            # plus ; ce job retire ce qui a déjà été écrit, puis republie sur
            # l'entrepôt allégé — sans quoi le site continuerait de servir les
            # 557 fichiers de carte d'un niveau qu'il n'affiche plus.
            set -e
            python -m plateforme.retrait_interco
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "rechargement-socle" ]; then
            set -e
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux departement,region --depuis 2018
            exit $?
          fi
          if [ "$JOB" = "rechargement-communes" ]; then
            # `depuis_lot` reprend un chargement coupé : chaque lot communal
            # coûte 195 Mo à télécharger et autant à archiver, et les lots déjà
            # écrits sont dans l'entrepôt, renvoyé au bucket même en cas
            # d'échec. Le champ `lot` de la requête dit où reprendre.
            LOT=$(jq -r '.lot // 1' .github/ingest-request.json)
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2018 --depuis-lot "$LOT"
            exit $?
          fi
          if [ "$JOB" = "rechargement-reste" ]; then
            set -e
            python -m plateforme.normalize.dotations --store r2:plateforme-raw
            python -m plateforme.normalize.revenus --store r2:plateforme-raw
            python -m plateforme.normalize.population --store r2:plateforme-raw
            python -m plateforme.normalize.deces --store r2:plateforme-raw
            python -m plateforme.normalize.equipements --store r2:plateforme-raw
            python -m plateforme.normalize.entreprises --store r2:plateforme-raw
            python -m plateforme.normalize.creations --store r2:plateforme-raw
            python -m plateforme.normalize.secteurs --store r2:plateforme-raw
            python -m plateforme.normalize.tourisme --store r2:plateforme-raw
            python -m plateforme.normalize.elections --store r2:plateforme-raw
            python -m plateforme.normalize.logement --store r2:plateforme-raw
            python -m plateforme.normalize.famille --store r2:plateforme-raw
            python -m plateforme.normalize.professions --store r2:plateforme-raw
            python -m plateforme.normalize.etatcivil --store r2:plateforme-raw
            python -m plateforme.normalize.emploi --store r2:plateforme-raw
            python -m plateforme.normalize.maires --store r2:plateforme-raw
            python -m plateforme.normalize.fiscalite --store r2:plateforme-raw --depuis 2022
            python -m plateforme.normalize.securite --store r2:plateforme-raw
            python -m plateforme.normalize.sante --store r2:plateforme-raw
            python -m plateforme.normalize.education --store r2:plateforme-raw
            python -m plateforme.normalize.etat --store r2:plateforme-raw
            python -m plateforme.normalize.macro --store r2:plateforme-raw
            python -m plateforme.normalize.europe --store r2:plateforme-raw
            python -m plateforme.normalize.chomage --store r2:plateforme-raw
            python -m plateforme.normalize.cofog --store r2:plateforme-raw
            python -m plateforme.normalize.secu --store r2:plateforme-raw
            python -m plateforme.normalize.conjoncture --store r2:plateforme-raw
            python -m plateforme.normalize.prix --store r2:plateforme-raw
            python -m plateforme.normalize.apu --store r2:plateforme-raw
            python -m plateforme.normalize.consommation --store r2:plateforme-raw
            python -m plateforme.normalize.prenoms --store r2:plateforme-raw
            python -m plateforme.normalize.impots_locaux --store r2:plateforme-raw
            python -m plateforme.normalize.depenses_fiscales --store r2:plateforme-raw
            python -m plateforme.normalize.delais_paiement --store r2:plateforme-raw
            python -m plateforme.normalize.mutations --store r2:plateforme-raw
            python -m plateforme.normalize.impot_revenu --store r2:plateforme-raw
            python -m plateforme.normalize.exonerations --store r2:plateforme-raw
            python -m plateforme.normalize.chomage_indemnisation --store r2:plateforme-raw
            python -m plateforme.normalize.prescriptions --store r2:plateforme-raw
            python -m plateforme.normalize.salaires --store r2:plateforme-raw
            python -m plateforme.normalize.loyers --store r2:plateforme-raw
            python -m plateforme.normalize.construction --store r2:plateforme-raw
            python -m plateforme.normalize.fonds_europeens --store r2:plateforme-raw
            python -m plateforme.normalize.subventions --store r2:plateforme-raw
            python -m plateforme.normalize.execution_missions --store r2:plateforme-raw
            python -m plateforme.normalize.protection_sociale --store r2:plateforme-raw
            python -m plateforme.normalize.departements_fonctionnel --store r2:plateforme-raw
            python -m plateforme.normalize.prelevements_ue --store r2:plateforme-raw
            python -m plateforme.normalize.naissances --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "rechargement" ]; then
            # Reconstruction complète de l'entrepôt depuis les sources. Sert une
            # fois : au premier remplissage de l'entrepôt DuckDB, qui naît vide.
            # L'ordre suit les dépendances — le référentiel géographique d'abord,
            # tout le reste s'y rattache — et la publication vient en dernier,
            # une seule fois, sur un état cohérent. Son garde-fou refusera de
            # remplacer le site en ligne par un entrepôt incomplet.
            set -e
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux departement,region --depuis 2018
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2018
            python -m plateforme.normalize.dotations --store r2:plateforme-raw
            python -m plateforme.normalize.revenus --store r2:plateforme-raw
            python -m plateforme.normalize.population --store r2:plateforme-raw
            python -m plateforme.normalize.deces --store r2:plateforme-raw
            python -m plateforme.normalize.equipements --store r2:plateforme-raw
            python -m plateforme.normalize.entreprises --store r2:plateforme-raw
            python -m plateforme.normalize.creations --store r2:plateforme-raw
            python -m plateforme.normalize.secteurs --store r2:plateforme-raw
            python -m plateforme.normalize.tourisme --store r2:plateforme-raw
            python -m plateforme.normalize.elections --store r2:plateforme-raw
            python -m plateforme.normalize.logement --store r2:plateforme-raw
            python -m plateforme.normalize.famille --store r2:plateforme-raw
            python -m plateforme.normalize.professions --store r2:plateforme-raw
            python -m plateforme.normalize.etatcivil --store r2:plateforme-raw
            python -m plateforme.normalize.emploi --store r2:plateforme-raw
            python -m plateforme.normalize.maires --store r2:plateforme-raw
            python -m plateforme.normalize.fiscalite --store r2:plateforme-raw --depuis 2022
            python -m plateforme.normalize.securite --store r2:plateforme-raw
            python -m plateforme.normalize.sante --store r2:plateforme-raw
            python -m plateforme.normalize.education --store r2:plateforme-raw
            python -m plateforme.normalize.etat --store r2:plateforme-raw
            python -m plateforme.normalize.macro --store r2:plateforme-raw
            python -m plateforme.normalize.europe --store r2:plateforme-raw
            python -m plateforme.normalize.chomage --store r2:plateforme-raw
            python -m plateforme.normalize.cofog --store r2:plateforme-raw
            python -m plateforme.normalize.secu --store r2:plateforme-raw
            python -m plateforme.normalize.conjoncture --store r2:plateforme-raw
            python -m plateforme.normalize.prix --store r2:plateforme-raw
            python -m plateforme.normalize.apu --store r2:plateforme-raw
            python -m plateforme.normalize.consommation --store r2:plateforme-raw
            python -m plateforme.normalize.prenoms --store r2:plateforme-raw
            python -m plateforme.normalize.impots_locaux --store r2:plateforme-raw
            python -m plateforme.normalize.depenses_fiscales --store r2:plateforme-raw
            python -m plateforme.normalize.delais_paiement --store r2:plateforme-raw
            python -m plateforme.normalize.mutations --store r2:plateforme-raw
            python -m plateforme.normalize.impot_revenu --store r2:plateforme-raw
            python -m plateforme.normalize.exonerations --store r2:plateforme-raw
            python -m plateforme.normalize.chomage_indemnisation --store r2:plateforme-raw
            python -m plateforme.normalize.prescriptions --store r2:plateforme-raw
            python -m plateforme.normalize.salaires --store r2:plateforme-raw
            python -m plateforme.normalize.loyers --store r2:plateforme-raw
            python -m plateforme.normalize.construction --store r2:plateforme-raw
            python -m plateforme.normalize.fonds_europeens --store r2:plateforme-raw
            python -m plateforme.normalize.subventions --store r2:plateforme-raw
            python -m plateforme.normalize.execution_missions --store r2:plateforme-raw
            python -m plateforme.normalize.protection_sociale --store r2:plateforme-raw
            python -m plateforme.normalize.departements_fonctionnel --store r2:plateforme-raw
            python -m plateforme.normalize.prelevements_ue --store r2:plateforme-raw
            python -m plateforme.normalize.naissances --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "social-energie" ]; then
            # La vague sociale et énergie : RSA et prime d'activité (CNAF),
            # demandeurs d'emploi ABC (Dares), électricité et gaz (Agence ORE).
            set -e
            python -m plateforme.normalize.cnaf --store r2:plateforme-raw
            python -m plateforme.normalize.defm --store r2:plateforme-raw
            python -m plateforme.normalize.energie --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "libelles" ]; then
            # Reland des libellés simplifiés et de l'unité du taux de
            # participation, plus le grand livre des fonctions et une seule
            # publication : quatre connecteurs dont seul `declarer` a changé.
            set -e
            python -m plateforme.normalize.elections --store r2:plateforme-raw
            python -m plateforme.normalize.fiscalite --store r2:plateforme-raw --depuis 2022
            python -m plateforme.normalize.impots_locaux --store r2:plateforme-raw
            python -m plateforme.normalize.emploi --store r2:plateforme-raw
            python -m plateforme.normalize.fonctions_communes --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "fonctions-communes" ]; then
            python -m plateforme.normalize.fonctions_communes --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "publication" ]; then
            # Republier sans rien réingérer. Tout ce que `publish` calcule au
            # dépôt — repères, quartiles, agrégats nationaux — change avec le
            # code et non avec la donnée : relancer un connecteur pour les
            # rafraîchir ferait payer un téléchargement de source pour un calcul
            # qui n'en dépend pas.
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "national" ]; then
            python -m plateforme.normalize.macro --store r2:plateforme-raw
            python -m plateforme.normalize.europe --store r2:plateforme-raw
            exit $?
          fi
          if [ "$JOB" = "ofgl-et-publication" ]; then
            # Les critères de comparaison arrivent avec les finances locales :
            # recharger l'un sans republier l'autre laisserait le site incohérent.
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2022
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "fiscalite" ]; then
            python -m plateforme.normalize.fiscalite --store r2:plateforme-raw --depuis 2022
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "cofog" ]; then
            python -m plateforme.normalize.cofog --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "secu" ]; then
            python -m plateforme.normalize.secu --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "securite" ]; then
            python -m plateforme.normalize.securite --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "conjoncture" ]; then
            python -m plateforme.normalize.conjoncture --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "prix" ]; then
            python -m plateforme.normalize.prix --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "apu" ]; then
            python -m plateforme.normalize.apu --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "consommation" ]; then
            python -m plateforme.normalize.consommation --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "prenoms" ]; then
            python -m plateforme.normalize.prenoms --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          # Les trois connecteurs de finances locales en un seul run : ils
          # écrivent des indicateurs disjoints, et l'aller-retour de
          # l'entrepôt comme la republication du site coûtent plus cher
          # que les chargements eux-mêmes. `set -e` : si l'un échoue, les
          # suivants ne publient pas par-dessus.
          # La vague du 6 août : huit connecteurs écrits le même jour, qui
          # écrivent des indicateurs disjoints. Un seul run, une seule
          # publication — l'aller-retour de l'entrepôt coûte plus cher que
          # les chargements. `set -e` : si l'un échoue, les suivants ne
          # publient pas par-dessus.
          # La vague du 7 août : ce qui répond enfin à « pour quoi faire »
          # plutôt qu'à « combien ». Un seul run, une seule publication.
          if [ "$JOB" = "vague-aout-2" ]; then
            set -e
            python -m plateforme.normalize.execution_missions --store r2:plateforme-raw
            python -m plateforme.normalize.protection_sociale --store r2:plateforme-raw
            python -m plateforme.normalize.departements_fonctionnel --store r2:plateforme-raw
            python -m plateforme.normalize.prelevements_ue --store r2:plateforme-raw
            python -m plateforme.normalize.naissances --store r2:plateforme-raw
            python -m plateforme.normalize.subventions --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "execution-missions" ]; then
            python -m plateforme.normalize.execution_missions --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "protection-sociale" ]; then
            python -m plateforme.normalize.protection_sociale --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "subventions" ]; then
            python -m plateforme.normalize.subventions --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "vague-aout" ]; then
            set -e
            python -m plateforme.normalize.impot_revenu --store r2:plateforme-raw
            python -m plateforme.normalize.exonerations --store r2:plateforme-raw
            python -m plateforme.normalize.chomage_indemnisation --store r2:plateforme-raw
            python -m plateforme.normalize.prescriptions --store r2:plateforme-raw
            python -m plateforme.normalize.salaires --store r2:plateforme-raw
            python -m plateforme.normalize.loyers --store r2:plateforme-raw
            python -m plateforme.normalize.construction --store r2:plateforme-raw
            python -m plateforme.normalize.fonds_europeens --store r2:plateforme-raw
            python -m plateforme.normalize.subventions --store r2:plateforme-raw
            python -m plateforme.normalize.execution_missions --store r2:plateforme-raw
            python -m plateforme.normalize.protection_sociale --store r2:plateforme-raw
            python -m plateforme.normalize.departements_fonctionnel --store r2:plateforme-raw
            python -m plateforme.normalize.prelevements_ue --store r2:plateforme-raw
            python -m plateforme.normalize.naissances --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "finances-locales" ]; then
            set -e
            python -m plateforme.normalize.dotations --store r2:plateforme-raw
            python -m plateforme.normalize.delais_paiement --store r2:plateforme-raw
            python -m plateforme.normalize.mutations --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "mutations" ]; then
            python -m plateforme.normalize.mutations --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "delais-paiement" ]; then
            python -m plateforme.normalize.delais_paiement --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "depenses-fiscales" ]; then
            python -m plateforme.normalize.depenses_fiscales --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "impots-locaux" ]; then
            python -m plateforme.normalize.impots_locaux --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "sante" ]; then
            python -m plateforme.normalize.sante --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "logement-social" ]; then
            set -e
            python -m plateforme.normalize.logement_social --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "education" ]; then
            python -m plateforme.normalize.education --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "maintenance" ]; then
            # VACUUM FULL partition par partition, puis republication : aucune
            # donnée ne change, mais la version publiée signale la fin du run
            # et reprend les correctifs de publication en attente.
            python -m plateforme.maintenance
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "maires" ]; then
            python -m plateforme.normalize.maires --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "entreprises" ]; then
            python -m plateforme.normalize.entreprises --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "chomage" ]; then
            python -m plateforme.normalize.chomage --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "deces" ]; then
            python -m plateforme.normalize.deces --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "equipements" ]; then
            python -m plateforme.normalize.equipements --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "creations" ]; then
            python -m plateforme.normalize.creations --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "secteurs" ]; then
            python -m plateforme.normalize.secteurs --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "tourisme" ]; then
            python -m plateforme.normalize.tourisme --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "elections" ]; then
            python -m plateforme.normalize.elections --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "logement" ]; then
            python -m plateforme.normalize.logement --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "famille" ]; then
            python -m plateforme.normalize.famille --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "professions" ]; then
            python -m plateforme.normalize.professions --store r2:plateforme-raw
            python -m plateforme.normalize.etatcivil --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "etatcivil" ]; then
            python -m plateforme.normalize.etatcivil --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "emploi" ]; then
            python -m plateforme.normalize.emploi --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "recensement" ]; then
            # Les trois jeux du recensement et l'état civil d'un coup, publiés
            # une seule fois : chaque publication coûte quarante minutes sur
            # l'entrepôt entier, et quatre runs séparés en gaspilleraient trois.
            set -e
            python -m plateforme.normalize.logement --store r2:plateforme-raw
            python -m plateforme.normalize.famille --store r2:plateforme-raw
            python -m plateforme.normalize.professions --store r2:plateforme-raw
            python -m plateforme.normalize.etatcivil --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "population" ]; then
            python -m plateforme.normalize.population --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "revenus" ]; then
            python -m plateforme.normalize.revenus --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "dotations" ]; then
            # Les dotations se rattachent aux communes du référentiel et se
            # contrôlent contre le budget de l'État : les deux doivent être là.
            python -m plateforme.normalize.dotations --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "retention" ]; then
            # Applique la politique de rétention puis republie : laisser des
            # exercices dans les fichiers publiés alors qu'ils ont quitté la
            # base rendrait le site incohérent avec sa propre source.
            python -m plateforme.retention --appliquer
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "retablissement" ]; then
            # L'entrepôt est un fichier : il n'y a plus de base à sortir de la
            # lecture seule ni d'espace à rendre avant d'écrire. Le job garde son
            # nom parce que des requêtes en attente le citent, et se contente de
            # republier depuis l'entrepôt rapatrié.
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "etat" ]; then
            # Le budget de l'État se republie dans la foulée : le pont
            # « recettes -> dépenses -> solde » n'a de sens qu'entier.
            python -m plateforme.normalize.etat --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "publish" ]; then
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "geometries" ]; then
            # Publication dans la foulée : les fichiers de carte d'un niveau
            # n'ont de sens que si la couche de tuiles correspondante existe.
            python -m plateforme.normalize.geometries \
              --store r2:plateforme-raw --publication r2:plateforme-published
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "ofgl" ]; then
            # Le référentiel d'abord : les finances locales s'y rattachent.
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux departement,region --depuis 2018
            # Communes : historique borné à 2022 (D6quater — la tentative 2018 du
            # 2 août a mis la base en lecture seule : disque réel 500 Mo).
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2022
            exit $?
          fi
          if [ -z "$DATASET_ID" ]; then echo "aucun dataset_id" && exit 1; fi
          if [ -n "$PARAMS" ]; then
            python -m plateforme.ingest "$DATASET_ID" --store r2:plateforme-raw --params "$PARAMS"
          else
            python -m plateforme.ingest "$DATASET_ID" --store r2:plateforme-raw
          fi

      - name: Renvoyer l'entrepôt au bucket
        # `always()` : un chargement qui échoue à mi-course a déjà écrit, et
        # perdre ces écritures obligerait à tout refaire au lieu de reprendre.
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
        run: python -m plateforme.entrepot televerser

      - name: Signaler les sources en retard ou en échec
        # Après chaque ingestion, pas seulement au rendez-vous hebdomadaire :
        # « source coupée ⇒ alerte < 24 h » (T-23) se tient d'autant mieux que
        # l'état est réévalué souvent. L'issue est unique et son contenu
        # déterministe : la réévaluer ne produit pas de bruit.
        if: always()
        uses: ./.github/actions/alerter
        with:
          token: ${{ github.token }}
