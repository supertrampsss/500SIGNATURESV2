name: Ingestion

# Exécute un run d'ingestion réel : registre (Supabase) -> connecteur ->
# snapshot immuable (R2 plateforme-raw) -> lineage (Supabase).
# Déclenchement manuel pour l'instant ; les crons par source arrivent avec
# les tickets d'ingestion (docs/08). Secrets requis : docs/SETUP.md §3.

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: "dataset_id du registre (meta.dataset_registry)"
        required: true
      params:
        description: 'Filtres JSON optionnels, ex. {"GEO":"COM-33318","maxResult":"20"}'
        required: false
        default: ""
  # Déclencheur GitOps : committer .github/ingest-request.json lance le run
  # décrit dedans (l'app GitHub de l'agent n'a pas le droit workflow_dispatch).
  push:
    paths:
      - ".github/ingest-request.json"

# Deux ingestions simultanées écrivent dans les mêmes tables et publient deux
# jeux de fichiers concurrents : le dernier arrivé fixe `data/derniere.json`,
# qui peut alors pointer vers un export plus ancien que la base. On attend.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # l'alerte de fraîcheur tient une issue à jour (T-23)

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Un run qui traîne bloque la file d'ingestion entière : mieux vaut qu'il
    # échoue et se voie.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ./pipeline
      - name: Read request file (push trigger)
        id: req
        run: |
          if [ -f .github/ingest-request.json ]; then
            echo "dataset_id=$(jq -r '.dataset_id // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
            echo "params=$(jq -c '.params // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
            echo "job=$(jq -r '.job // empty' .github/ingest-request.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tiling toolchain
        # Après la lecture de la requête : c'est elle qui dit si on fait des tuiles.
        if: steps.req.outputs.job == 'geometries'
        run: sudo apt-get install -y -qq tippecanoe
      - name: Sync source registry
        env:
          PLATEFORME_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m plateforme.registry
      - name: Run ingestion
        env:
          PLATEFORME_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
          DATASET_ID: ${{ inputs.dataset_id || steps.req.outputs.dataset_id }}
          PARAMS: ${{ inputs.params || steps.req.outputs.params }}
          JOB: ${{ steps.req.outputs.job }}
        run: |
          # Le référentiel géographique enchaîne collecte et normalisation :
          # un référentiel sans son historique territorial serait inutilisable.
          if [ "$JOB" = "geo" ]; then
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            exit $?
          fi
          if [ "$JOB" = "national" ]; then
            python -m plateforme.normalize.macro --store r2:plateforme-raw
            python -m plateforme.normalize.europe --store r2:plateforme-raw
            exit $?
          fi
          if [ "$JOB" = "ofgl-et-publication" ]; then
            # Les critères de comparaison arrivent avec les finances locales :
            # recharger l'un sans republier l'autre laisserait le site incohérent.
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2022
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "fiscalite" ]; then
            python -m plateforme.normalize.fiscalite --store r2:plateforme-raw --depuis 2022
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "cofog" ]; then
            python -m plateforme.normalize.cofog --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "maires" ]; then
            python -m plateforme.normalize.maires --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "entreprises" ]; then
            python -m plateforme.normalize.entreprises --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "chomage" ]; then
            python -m plateforme.normalize.chomage --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "population" ]; then
            python -m plateforme.normalize.population --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "revenus" ]; then
            python -m plateforme.normalize.revenus --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "dotations" ]; then
            # Les dotations se rattachent aux communes du référentiel et se
            # contrôlent contre le budget de l'État : les deux doivent être là.
            python -m plateforme.normalize.dotations --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "retention" ]; then
            # Applique la politique de rétention puis republie : laisser des
            # exercices dans les fichiers publiés alors qu'ils ont quitté la
            # base rendrait le site incohérent avec sa propre source.
            python -m plateforme.retention --appliquer
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "etat" ]; then
            # Le budget de l'État se republie dans la foulée : le pont
            # « recettes -> dépenses -> solde » n'a de sens qu'entier.
            python -m plateforme.normalize.etat --store r2:plateforme-raw
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "publish" ]; then
            python -m plateforme.publish --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "geometries" ]; then
            python -m plateforme.normalize.geometries \
              --store r2:plateforme-raw --publication r2:plateforme-published
            exit $?
          fi
          if [ "$JOB" = "ofgl" ]; then
            # Le référentiel d'abord : les finances locales s'y rattachent.
            python -m plateforme.normalize.geo --store r2:plateforme-raw
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux epci,departement,region --depuis 2018
            # Communes : historique borné à 2022 pour tenir dans les 500 Mo du
            # plan gratuit Supabase (décision D6, politique dans
            # plateforme/retention.py). Les snapshots R2 couvrent 2018-2025 ;
            # une seule commande rechargera tout au passage au plan payant.
            python -m plateforme.normalize.ofgl --store r2:plateforme-raw \
              --niveaux commune --depuis 2022
            exit $?
          fi
          if [ -z "$DATASET_ID" ]; then echo "aucun dataset_id" && exit 1; fi
          if [ -n "$PARAMS" ]; then
            python -m plateforme.ingest "$DATASET_ID" --store r2:plateforme-raw --params "$PARAMS"
          else
            python -m plateforme.ingest "$DATASET_ID" --store r2:plateforme-raw
          fi

      - name: Signaler les sources en retard ou en échec
        # Après chaque ingestion, pas seulement au rendez-vous hebdomadaire :
        # « source coupée ⇒ alerte < 24 h » (T-23) se tient d'autant mieux que
        # l'état est réévalué souvent. L'issue est unique et son contenu
        # déterministe : la réévaluer ne produit pas de bruit.
        if: always()
        uses: ./.github/actions/alerter
        with:
          db-url: ${{ secrets.SUPABASE_DB_URL }}
          token: ${{ github.token }}
