name: Mandats story v11

on:
  pull_request:
  push:
    branches: [main]

jobs:
  story-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Mandats v11 story journeys
        run: npx playwright test --config playwright.story.config.ts
      - name: Publish journey exports, screenshots, traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-story-v11-${{ github.sha }}
          path: |
            site/story-artifacts/
            site/tests/fixtures/mandats-v11.json
          retention-days: 14
