name: Mandats board review

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mandats-board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify decisions, persistence and branch replay
        run: npx playwright test --config playwright.board.config.ts
      - name: Publish board captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-board-captures
          path: |
            site/board-audit-artifacts/**/*.png
            site/board-audit-artifacts/**/error-context.md
            !site/board-audit-artifacts/**/attachments/**
          retention-days: 14
      - name: Publish failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-board-debug
          path: site/playwright-report-board/
          retention-days: 7
