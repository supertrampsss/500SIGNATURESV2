name: Launch consent
on:
  pull_request:
    paths: ['site/**', '.github/workflows/launch-consent.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/launch-consent.yml']
jobs:
  launch-consent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Parcours consentement et lancement, cinq formats
        run: npx playwright test --config playwright.mandats.config.ts --grep 'Audience :|Lancement :'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-consent-browser
          path: |
            site/playwright-report-mandats/
            site/test-results/
          retention-days: 7
