name: Mandats illustrated map and social consequences

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rework-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the legacy v13 decision panel and secondary navigation
        run: npx playwright test --config playwright.interface.config.ts
      - name: Verify the crisis command board, simultaneous fronts and initiative menu
        run: npx playwright test --config playwright.command.config.ts
      - name: Verify visible reform access, quantified reports and delivered crisis recovery
        run: npx playwright test --config playwright.reports.config.ts
      - name: Verify illustration, full mandates, actual replay and image fallback
        run: npx playwright test --config playwright.rework.config.ts
      - name: Verify delivery, rejected votes and imported saves
        run: npx playwright test --config playwright.social.config.ts --project desktop-chromium --project android-chromium --project compact-chromium --project iphone-webkit
      - name: Explore persistent pressure and accounting invariants
        env:
          MANDATS_PRESSURE_VERSION: '15'
          MANDATS_PRESSURE_SEEDS: '3'
          MANDATS_PRESSURE_BRANCH_SEEDS: '1'
        run: |
          node --experimental-strip-types scripts/mandats-pressure-audit.ts
          node --experimental-strip-types scripts/mandats-pressure-review.ts pressure-artifacts/model
      - name: Preserve published v13 trajectories
        run: node --experimental-strip-types scripts/mandats-legacy-pressure-audit.ts
      - name: Verify pressure, recovery, mobile controls and causal replay
        run: npx playwright test --config playwright.pressure.config.ts
      - name: Verify persistent incidents, delivery and legacy rules
        run: npx playwright test --config playwright.incidents.config.ts
      - name: Retain screenshots, replay inputs and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-rework-${{ github.sha }}
          path: |
            site/rework-artifacts/
            site/interface-artifacts/
            site/reports-artifacts/
            site/social-artifacts/
            site/pressure-artifacts/
            site/incidents-artifacts/
          retention-days: 14
