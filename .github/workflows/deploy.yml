name: Deploy site

# Déploiement sur Cloudflare Pages. Le site est indexable depuis que les sept
# vérifications du lot 4 ont été constatées sur le déploiement (décision D1).
#
# Aucun filtre de branche : le projet n'a qu'un site et qu'une branche de
# développement, et le déploiement doit suivre le travail en cours. Le fichier
# `deploy-request.json` permet de redéployer sans toucher au site — l'app
# GitHub de l'agent n'a pas le droit `workflow_dispatch`.

on:
  workflow_dispatch:
  push:
    paths:
      - "site/**"
      - "pipeline/plateforme/domaine.py"
      - ".github/deploy-request.json"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # L'adresse du site, écrite une fois pour tout le déploiement.
    #
    # Le pré-rendu en a besoin : les balises `og:image` et `og:url` des pages
    # d'analyse doivent être **absolues**, sans quoi les robots des plateformes
    # ne les résolvent pas et le lien part sans aperçu. Le domaine public est
    # celui de la marque, rattaché au projet Pages juste après la publication.
    #
    # La même valeur sert à la dernière étape, qui rejoue depuis cette origine
    # la requête du navigateur contre le bucket de données : si elle cesse
    # d'être l'adresse du site, ce contrôle-là échoue. C'est ce qui la tient
    # vraie, plutôt qu'un commentaire.
    env:
      SITE_URL: https://500signatures.fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ./pipeline
      - name: Contrôler les analyses
        # D11 : ce contrôle déterministe remplace la relecture humaine des
        # montants cités dans les analyses éditoriales. Avant le build, pour
        # qu'un chiffre faux n'atteigne jamais le site.
        run: python -m plateforme.controle_analyses site/analyses
      - run: npm ci || npm install
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Publish to Cloudflare Pages
        # **Depuis `site/`, jamais depuis la racine du dépôt.** `wrangler pages
        # deploy` cherche le répertoire `functions` relativement au répertoire
        # courant : publié depuis la racine, il ne verrait jamais
        # `site/functions/`, la fonction d'aperçu partirait sans bruit et les
        # liens de scénario resteraient génériques — un échec qui ressemble
        # trait pour trait à un succès. `scripts/deploiement.test.ts` fait
        # rougir si cette étape quitte le répertoire qui porte `functions/`.
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--branch=main`, jamais un nom de branche de travail : Cloudflare sert
        # les autres branches sous `<branche>.<projet>.pages.dev`, un niveau de
        # sous-domaine que son certificat générique ne couvre pas. Le navigateur
        # refuse alors la connexion (ERR_SSL_VERSION_OR_CIPHER_MISMATCH).
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=plateforme --branch=main --commit-dirty=true

      - name: Servir la production sur 500signatures.fr
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m plateforme.domaine --project plateforme \
            --domain 500signatures.fr --domain www.500signatures.fr

      - name: Autoriser le navigateur à lire les données
        # Le site et les données ne sont pas sur la même origine. Sans politique
        # CORS sur le bucket, la page n'affiche que « Les données n'ont pas pu
        # être chargées » — alors que `curl` télécharge tout sans broncher.
        # L'étape repose la politique et la vérifie en rejouant la requête du
        # navigateur, en-tête `Origin` compris.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN_ID: f142f16ee69b9e33f8b2b4acd83d7f6a # id du token, non secret
        run: python -m plateforme.cors --bucket plateforme-published --origine "$SITE_URL"

