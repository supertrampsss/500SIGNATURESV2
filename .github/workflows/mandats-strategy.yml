name: Mandats presidential strategy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strategy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Audit bounded strategies, shared means and historical numeric trajectories
        run: node --experimental-strip-types scripts/mandats-strategy-audit.ts
      - name: Play opening autonomy, strategy, transformation and honest endings
        run: npx playwright test --config playwright.strategy.config.ts
      - name: Verify the presidential desk on desktop and phones
        run: npx playwright test --config playwright.desk.config.ts
      - name: Retain reproducible inputs, screenshots, video and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandats-strategy-${{ github.sha }}
          path: |
            site/strategy-artifacts/
            site/desk-artifacts/
          retention-days: 14
