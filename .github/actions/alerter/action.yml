name: Alerter sur les sources
description: >-
  Tient UNE issue à jour listant les jeux en retard, en échec ou dont un contrôle
  bloquant a échoué. La ferme d'elle-même quand tout est rentré dans l'ordre.

# Partagée entre le rendez-vous programmé et l'ingestion : deux copies du même
# bloc auraient divergé, et c'est l'alerte silencieuse qu'on ne remarque pas.

inputs:
  token:
    description: "Jeton GitHub ayant le droit d'écrire les issues"
    required: true
  titre:
    description: Titre de l'issue unique. Le changer en ouvrirait une seconde.
    required: false
    default: Sources en retard ou en échec

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TITRE: ${{ inputs.titre }}
      run: |
        set -e
        python -m plateforme.alertes --format json > alertes.json
        python -m plateforme.alertes --format markdown > alertes.md
        NOMBRE=$(python -c "import json;print(len(json.load(open('alertes.json'))))")
        # Filtrage sur le titre exact plutôt que par `--search` : la recherche
        # plein texte de GitHub normalise les accents et pourrait tout aussi
        # bien rater l'issue que rapporter une voisine.
        NUMERO=$(gh issue list --state open --limit 100 --json number,title \
                   --jq '[.[] | select(.title == env.TITRE)] | first | .number // empty')
        if [ "$NOMBRE" -eq 0 ]; then
          if [ -n "$NUMERO" ]; then
            gh issue comment "$NUMERO" --body "Toutes les sources sont revenues dans leur fenêtre de fraîcheur. Fermeture automatique."
            gh issue close "$NUMERO"
            echo "issue #$NUMERO fermée"
          else
            echo "aucune source à signaler"
          fi
          exit 0
        fi
        if [ -n "$NUMERO" ]; then
          gh issue edit "$NUMERO" --body-file alertes.md
          echo "issue #$NUMERO mise à jour ($NOMBRE jeux)"
        else
          gh issue create --title "$TITRE" --body-file alertes.md
          echo "issue ouverte ($NOMBRE jeux)"
        fi
