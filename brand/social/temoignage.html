<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 Signatures · témoignage</title>
<link rel="stylesheet" href="../polices.css">
<style>
/* Modèle de publication 500 Signatures. Cliquez sur un texte pour le modifier, puis faites une capture du cadre. */
:root{--nuit:#060b17;--nuit-2:#0b1422;--iv:#f4efe3;--iv-2:#fbfaf6;--or:#d9b45f;--or-2:#f2d58a;--argile:#e07a55;--gris:#b9b2a3;--encre:#0b1422;
--serif:"Spectral",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#2a2f38}body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;font-family:var(--sans)}
.aide{color:#cfd4dc;font:400 13px var(--sans)}
.cadre{position:relative;width:1200px;height:675px;overflow:hidden;flex:none;background:var(--nuit);color:var(--iv)}
[contenteditable]{outline:none}[contenteditable]:focus{box-shadow:0 0 0 2px #d9b45f80}
.marque{display:block;color:var(--iv)}
.etiquette{font:500 22px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
.source{font:400 20px var(--mono);color:var(--gris)}
.signe{display:flex;align-items:center;gap:18px;font:500 22px var(--mono);letter-spacing:.12em;color:var(--gris)}
.signe .marque{width:96px}
em{font-style:italic;color:var(--or)}
@media print{.aide{display:none}body{padding:0;background:none}}

.cadre{background:var(--iv-2);color:var(--encre);padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between}
.cadre .marque{color:var(--encre)}
.modele{position:absolute;top:0;right:0;font:600 18px var(--sans);background:var(--argile);color:#fff;padding:10px 18px}
blockquote{margin:0;font:300 54px/1.18 var(--serif);letter-spacing:-.015em;max-width:960px;text-wrap:balance}
blockquote::before{content:"« ";color:#b58f2e}blockquote::after{content:" »";color:#b58f2e}
.auteur{display:flex;align-items:center;gap:20px}
.avatar{width:72px;height:72px;border-radius:50%;background:#e9e3d4;display:grid;place-items:center;font:600 28px var(--sans);color:#6b6253}
.auteur b{display:block;font:600 26px var(--sans)}.auteur span{font:400 20px var(--mono);color:#5c6b80}
.pied{display:flex;justify-content:space-between;align-items:center}
.cadre .signe{color:#5c6b80}
</style></head><body><p class="aide">Cliquez sur un texte pour le modifier. Capture du cadre : 1200 × 675 px.</p>
<main class="cadre" aria-label="500 Signatures · témoignage">
<span class="modele" contenteditable>Modèle : à remplacer par un message réel, avec l’accord de son auteur</span>
<p class="etiquette" style="color:#5c6b80" contenteditable>Vous nous écrivez</p>
<blockquote contenteditable>[Le message d’un lecteur : ce qu’il a compris ou découvert grâce au site.]</blockquote>
