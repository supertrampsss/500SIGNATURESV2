<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 Signatures · story</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;800&family=Spectral:ital,wght@0,300;0,600;1,300&display=swap">
<style>
/* Modèle de publication 500 Signatures. Cliquez sur un texte pour le modifier, puis faites une capture du cadre. */
:root{--nuit:#060b17;--nuit-2:#0b1422;--iv:#f4efe3;--iv-2:#fbfaf6;--or:#d9b45f;--or-2:#f2d58a;--argile:#e07a55;--gris:#b9b2a3;--encre:#0b1422;
--serif:"Spectral",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#2a2f38}body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;font-family:var(--sans)}
.aide{color:#cfd4dc;font:400 13px var(--sans)}
.cadre{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;background:var(--nuit);color:var(--iv)}
[contenteditable]{outline:none}[contenteditable]:focus{box-shadow:0 0 0 2px #d9b45f80}
.marque{display:block;color:var(--iv)}
.etiquette{font:500 22px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
.source{font:400 20px var(--mono);color:var(--gris)}
.signe{display:flex;align-items:center;gap:18px;font:500 22px var(--mono);letter-spacing:.12em;color:var(--gris)}
.signe .marque{width:96px}
em{font-style:italic;color:var(--or)}
@media print{.aide{display:none}body{padding:0;background:none}}

.cadre{padding:140px 90px 120px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#0b1430 0%,var(--nuit) 55%,#1a0f0c 100%)}
.nombre{margin:0;font:900 230px/.9 var(--sans);letter-spacing:-.06em;color:var(--argile)}
.nombre small{font-size:.32em;color:var(--iv);margin-left:.08em}
h1{margin:40px 0 0;font:300 84px/1.08 var(--serif);letter-spacing:-.02em;text-wrap:balance}
.lien{display:flex;flex-direction:column;align-items:center;gap:26px}
.lien span{font:600 34px var(--sans);color:var(--nuit);background:var(--or);padding:26px 44px;border-radius:999px}
.lien .marque{width:180px}
</style></head><body><p class="aide">Cliquez sur un texte pour le modifier. Capture du cadre : 1080 × 1920 px.</p>
