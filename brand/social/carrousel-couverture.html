<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 Signatures · couverture de carrousel</title>
<link rel="stylesheet" href="../polices.css">
<style>
/* Modèle de publication 500 Signatures. Cliquez sur un texte pour le modifier, puis faites une capture du cadre. */
:root{--nuit:#060b17;--nuit-2:#0b1422;--iv:#f4efe3;--iv-2:#fbfaf6;--or:#d9b45f;--or-2:#f2d58a;--argile:#e07a55;--gris:#b9b2a3;--encre:#0b1422;
--serif:"Spectral",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#2a2f38}body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;font-family:var(--sans)}
.aide{color:#cfd4dc;font:400 13px var(--sans)}
.cadre{position:relative;width:1080px;height:1350px;overflow:hidden;flex:none;background:var(--nuit);color:var(--iv)}
[contenteditable]{outline:none}[contenteditable]:focus{box-shadow:0 0 0 2px #d9b45f80}
.marque{display:block;color:var(--iv)}
.etiquette{font:500 22px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
.source{font:400 20px var(--mono);color:var(--gris)}
.signe{display:flex;align-items:center;gap:18px;font:500 22px var(--mono);letter-spacing:.12em;color:var(--gris)}
.signe .marque{width:96px}
em{font-style:italic;color:var(--or)}
@media print{.aide{display:none}body{padding:0;background:none}}

.cadre{padding:90px 84px;display:flex;flex-direction:column;justify-content:space-between}
.cadre::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(0deg,#d9b45f14,transparent)}
h1{margin:0;font:300 90px/1.04 var(--serif);hyphens:none;letter-spacing:-.03em;text-wrap:balance}
.nombre{font:900 300px/.85 var(--sans);letter-spacing:-.06em;color:var(--or);margin:0}
.nombre small{font-size:.28em;letter-spacing:-.02em;margin-left:.1em;color:var(--iv)}
.bas{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
.glisser{font:600 26px var(--sans);color:var(--nuit);background:var(--or);padding:18px 30px;border-radius:999px}
</style></head><body><p class="aide">Cliquez sur un texte pour le modifier. Capture du cadre : 1080 × 1350 px.</p>
<main class="cadre" aria-label="500 Signatures · couverture de carrousel">
<p class="etiquette" contenteditable>Carrousel · 1/6</p>
<div><p class="nombre" contenteditable>100<small>€</small></p><h1 contenteditable>Vos impôts, <em>où vont-ils&nbsp;?</em> Cinq repères pour comprendre.</h1></div>
<div class="bas"><div class="signe"><svg class="marque" viewBox="0 0 250 132" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M60 12 H25 L20 50 C28 44 37 42 45 42.5 C61 44 72 55 72 69 C72 85 59 96 43 96 C31 96 22 91 16 83"/><ellipse cx="118" cy="54" rx="27" ry="42"/><ellipse cx="186" cy="54" rx="27" ry="42"/><path d="M2 118 C60 108 140 104 200 110 C220 112 234 106 244 94" stroke="#d9b45f" stroke-width="7"/></g></svg></div><span class="glisser" contenteditable>Faites glisser →</span></div></main></body></html>
